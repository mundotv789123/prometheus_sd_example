volumes:
  prometheus-data:

services:
  app-sd:
    build: .
    ports:
      - "8080:8080"

  app-java:
    build: example
    volumes:
      - "./application.properties:/app/application.properties"
    ports:
      - "8081:8080"

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
      - "prometheus-data:/prometheus"